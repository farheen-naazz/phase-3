name: Phase 3 - Automated Testing

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "challenge-3-testing/**"
      - ".github/workflows/testing.yml"

  pull_request:
    branches:
      - main
    paths:
      - "challenge-3-testing/**"
      - ".github/workflows/testing.yml"

permissions:
  contents: read

jobs:
  automated-tests:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run automated unit tests
        working-directory: challenge-3-testing
        run: python -m unittest discover -s tests -v